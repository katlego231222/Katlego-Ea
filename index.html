<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katlego V6.0 TRUE LOCK</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#050714;color:white}
.buy{border:4px solid #22c55e;box-shadow:0 0 80px #22c55e}
.sell{border:4px solid #ef4444;box-shadow:0 0 80px #ef4444}
.wait{border:2px solid #334155}
.locked{animation:none!important}
</style>
</head>
<body class="p-2">
<div class="max-w-lg mx-auto">
<h1 class="text-center font-black text-sm">KATLEGO <span class="text-emerald-400">V6.0</span> <span class="text-[9px] bg-green-400 text-black px-2 py-1 rounded-full">🔒 TRUE LOCK</span></h1>

<div id="signalCard" class="wait bg-slate-900 rounded-[28px] p-6 mt-3 text-center">
<div id="signalText" class="text-7xl font-black">WAIT</div>
<div id="lockBadge" class="hidden mt-3 text-[11px] bg-yellow-400 text-black rounded-full py-2 px-4 font-black">🔒 LOCKED - Will NOT change until TP/SL hit</div>
<div id="reason" class="text-[11px] mt-3 text-slate-300">No active trade. Scanning...</div>

<div id="tradeBox" class="grid grid-cols-3 gap-2 mt-5 hidden">
<div class="bg-black rounded-2xl p-3 border border-slate-700"><div class="text-[8px] text-slate-400">ENTRY</div><div id="entryP" class="font-mono font-black text-lg">--</div></div>
<div class="bg-black rounded-2xl p-3 border border-red-900"><div class="text-[8px] text-red-300">SHORT SL</div><div id="slP" class="font-mono font-black text-lg text-red-400">--</div></div>
<div class="bg-black rounded-2xl p-3 border border-green-900"><div class="text-[8px] text-green-300">LONG TP</div><div id="tpP" class="font-mono font-black text-lg text-green-400">--</div></div>
</div>

<div id="controlBox" class="mt-5 hidden">
<div id="livePnl" class="text-[13px] font-mono font-bold">Holding...</div>
<div class="grid grid-cols-2 gap-2 mt-3">
<button onclick="closeTrade(true)" class="bg-green-500 text-black py-3 rounded-xl text-[12px] font-black">✅ TP HIT +$14 - NEXT</button>
<button onclick="closeTrade(false)" class="bg-red-900 text-white py-3 rounded-xl text-[12px] font-bold">❌ SL HIT -$3.5 - NEXT</button>
</div>
<div class="text-[8px] text-slate-500 mt-2">Signal stays LOCKED until you press TP or SL. It will NEVER flip to WAIT by itself.</div>
</div>
</div>

<div class="bg-slate-900 rounded-2xl p-3 mt-3 border border-slate-800 flex justify-between">
<div><div class="text-[9px] text-slate-400">GOLD LIVE</div><div id="livePrice" class="text-2xl font-mono font-black">4180.15</div></div>
<div class="text-right"><div id="activeInfo" class="text-[10px] font-bold">Scanning...</div><div id="tradeCount" class="text-[8px] text-slate-400">Locks: 0 | Wins: 0</div></div>
</div>

<div class="bg-slate-900 rounded-2xl p-2 mt-3 border border-slate-800"><div id="tv_chart" style="height:480px" class="rounded-xl overflow-hidden bg-black"></div></div>
</div>

<script>
let ticks=[], lastPrice=4180.15, activeTrade=JSON.parse(localStorage.getItem('kat_v6_trade')||'null'), stats=JSON.parse(localStorage.getItem('kat_v6_stats')||'{"total":0,"wins":0}');
function loadTV(){document.getElementById('tv_chart').innerHTML=''; new TradingView.widget({"autosize":true,"symbol":"OANDA:XAUUSD","interval":'5',"timezone":"Africa/Johannesburg","theme":"dark","style":"1","container_id":"tv_chart"});} loadTV();
function save(){localStorage.setItem('kat_v6_trade',JSON.stringify(activeTrade)); localStorage.setItem('kat_v6_stats',JSON.stringify(stats));}

setInterval(()=>{
  lastPrice+=(Math.random()-0.5)*0.2; // super slow drift, won't auto-hit TP
  ticks.push(lastPrice); if(ticks.length>250) ticks.shift();
  document.getElementById('livePrice').innerText=lastPrice.toFixed(2);
  if(!activeTrade && ticks.length>=10) checkForNewSignal();
  if(activeTrade) updateLocked();
},700);

function ema(a,p){let k=2/(p+1), e=a[0]; for(let i=1;i<a.length;i++) e=a[i]*k+e*(1-k); return e;}
function rsi(a,per=14){if(a.length<per+1) return 50; let g=0,l=0; for(let i=a.length-per;i<a.length;i++){let d=a[i]-a[i-1]; if(d>=0) g+=d; else l-=d;} return 100-(100/(1+g/(l||0.001)));}

function checkForNewSignal(){
  let e10=ema(ticks.slice(-10),10), e20=ema(ticks.slice(-20),20);
  let r=rsi(ticks,14), r7=rsi(ticks.slice(-12),7);
  let last=ticks[ticks.length-1];
  let low=Math.min(...ticks.slice(-15)), high=Math.max(...ticks.slice(-15));
  if(e10>=e20-0.6 && e10<=e20+0.8 && r>=36 && r<=58 && r7>43 && (last-low)<3.0){
    lockTrade("BUY",last,last-3.5,last+14.0);
  }else if(e10>=e20-0.8 && e10<=e20+0.6 && r>=42 && r<=65 && r7<57 && (high-last)<3.0){
    lockTrade("SELL",last,last+3.5,last-14.0);
  }else{
    if(!activeTrade){
      document.getElementById('signalText').innerText="WAIT";
      document.getElementById('reason').innerText="Scanning early dip... RSI "+r.toFixed(0);
      document.getElementById('signalCard').className="wait bg-slate-900 rounded-[28px] p-6 mt-3 text-center";
    }
  }
}

function lockTrade(dir,entry,sl,tp){
  activeTrade={dir,entry,sl,tp}; stats.total++; save();
  document.getElementById('signalText').innerText=dir;
  document.getElementById('signalCard').className=(dir==="BUY"?"buy":"sell")+" bg-slate-900 rounded-[28px] p-6 mt-3 text-center locked";
  document.getElementById('lockBadge').classList.remove('hidden');
  document.getElementById('reason').innerText="🔒 LOCKED "+dir+" at "+entry.toFixed(2)+" | SL "+sl.toFixed(2)+" TP "+tp.toFixed(2)+" | Will NOT change until you press TP HIT";
  document.getElementById('tradeBox').classList.remove('hidden');
  document.getElementById('controlBox').classList.remove('hidden');
  document.getElementById('entryP').innerText=entry.toFixed(2);
  document.getElementById('slP').innerText=sl.toFixed(2);
  document.getElementById('tpP').innerText=tp.toFixed(2);
  document.getElementById('activeInfo').innerText="🔒 "+dir+" LOCKED";
  document.getElementById('tradeCount').innerText="Locks: "+stats.total+" | Wins: "+stats.wins;
  if(navigator.vibrate) navigator.vibrate([500,100,500]);
}

function updateLocked(){
  document.getElementById('signalText').innerText=activeTrade.dir;
  document.getElementById('signalCard').className=(activeTrade.dir==="BUY"?"buy":"sell")+" bg-slate-900 rounded-[28px] p-6 mt-3 text-center locked";
  document.getElementById('lockBadge').classList.remove('hidden');
  document.getElementById('tradeBox').classList.remove('hidden');
  document.getElementById('controlBox').classList.remove('hidden');
  document.getElementById('entryP').innerText=activeTrade.entry.toFixed(2);
  document.getElementById('slP').innerText=activeTrade.sl.toFixed(2);
  document.getElementById('tpP').innerText=activeTrade.tp.toFixed(2);
  document.getElementById('activeInfo').innerText="🔒 "+activeTrade.dir+" LOCKED";
  document.getElementById('reason').innerText="🔒 LOCKED "+activeTrade.dir+" Entry "+activeTrade.entry.toFixed(2)+" | Press TP HIT when your MT5 hits TP 4187.86";
  document.getElementById('livePnl').innerText="Trade LOCKED: "+activeTrade.dir+" @ "+activeTrade.entry.toFixed(2)+" → TP "+activeTrade.tp.toFixed(2);
}

function closeTrade(isWin){
  if(isWin) stats.wins++;
  stats.total=Math.max(stats.total,1);
  activeTrade=null; save();
  document.getElementById('signalText').innerText=isWin?"TP HIT!":"SL HIT";
  document.getElementById('lockBadge').classList.add('hidden');
  document.getElementById('tradeBox').classList.add('hidden');
  document.getElementById('controlBox').classList.add('hidden');
  document.getElementById('signalCard').className="wait bg-slate-900 rounded-[28px] p-6 mt-3 text-center";
  document.getElementById('reason').innerText=isWin?"✅ TP +$14 WIN! Scanning for next...":"❌ SL -$3.5 Loss. Scanning next...";
  document.getElementById('activeInfo').innerText="Scanning next...";
  document.getElementById('tradeCount').innerText="Locks: "+stats.total+" | Wins: "+stats.wins+" | WR "+((stats.wins/stats.total)*100).toFixed(0)+"%";
  setTimeout(()=>{document.getElementById('signalText').innerText="WAIT";},2000);
}

// restore on load
if(activeTrade) updateLocked();
</script>
</body>
</html>
