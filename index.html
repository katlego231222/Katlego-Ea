<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katlego V5.9 HOLD UNTIL TP</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#050714;color:white}
.buy{border:3px solid #22c55e;box-shadow:0 0 60px #22c55e88}
.sell{border:3px solid #ef4444;box-shadow:0 0 60px #ef444488}
.wait{border:2px solid #334155}
.tp-hit{border:3px solid #facc15;box-shadow:0 0 60px #facc1588;animation:flash 0.5s 3}
@keyframes flash{0%,100%{opacity:1}50%{opacity:0.6}}
</style>
</head>
<body class="p-2">
<div class="max-w-lg mx-auto">
<h1 class="text-center font-black text-sm">KATLEGO <span class="text-emerald-400">V5.9</span> <span class="text-[8px] bg-yellow-400 text-black px-2 py-1 rounded-full">HOLD TILL TP</span></h1>

<div id="signalCard" class="wait bg-slate-900 rounded-[28px] p-5 mt-3 text-center">
<div id="signalText" class="text-7xl font-black">WAIT</div>
<div id="tradeStatus" class="mt-2 text-[11px] bg-black border border-slate-700 rounded-full py-1 px-3 inline-block">No active trade - Scanning...</div>
<div id="reason" class="text-[11px] mt-3 text-slate-300">Waiting for early dip...</div>

<div id="tradeBox" class="grid grid-cols-3 gap-3 mt-4 hidden">
<div class="bg-black rounded-2xl p-3 border border-slate-700"><div class="text-[8px] text-slate-400">ENTRY</div><div id="entryP" class="font-mono font-black text-lg">--</div><div id="entryStatus" class="text-[7px] text-slate-400">--</div></div>
<div class="bg-black rounded-2xl p-3 border border-red-900"><div class="text-[8px] text-red-300">SHORT SL</div><div id="slP" class="font-mono font-black text-lg text-red-400">--</div><div class="text-[7px] text-red-400">Risk -$3.5</div></div>
<div class="bg-black rounded-2xl p-3 border border-green-900"><div class="text-[8px] text-green-300">LONG TP</div><div id="tpP" class="font-mono font-black text-lg text-green-400">--</div><div class="text-[7px] text-green-400">Win +$14</div></div>
</div>

<div id="pnlBox" class="mt-3 bg-black rounded-xl p-3 hidden">
<div class="flex justify-between text-[10px]"><span class="text-slate-400">Live PnL:</span><span id="livePnl" class="font-mono font-bold">--</span></div>
<div class="w-full bg-slate-800 rounded-full h-2 mt-2"><div id="progressBar" class="h-2 rounded-full bg-emerald-500" style="width:0%"></div></div>
<div id="distance" class="text-[8px] text-slate-400 mt-1">Distance to TP: --</div>
</div>
</div>

<div class="bg-slate-900 rounded-2xl p-3 mt-3 border border-slate-800 flex justify-between">
<div><div class="text-[9px] text-slate-400">GOLD LIVE</div><div id="livePrice" class="text-2xl font-mono font-black">4175.00</div></div>
<div class="text-right"><div id="activeInfo" class="text-[10px] font-bold">No active trade</div><div id="tradeCount" class="text-[8px] text-slate-400">Trades: 0 | Wins: 0</div></div>
</div>

<div class="bg-slate-900 rounded-2xl p-2 mt-3 border border-slate-800"><div id="tv_chart" style="height:480px" class="rounded-xl overflow-hidden bg-black"></div></div>
</div>

<audio id="buySound" preload="auto"><source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg"></audio>
<audio id="tpSound" preload="auto"><source src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg" type="audio/ogg"></audio>

<script>
let ticks=[], lastPrice=4175.0;
let activeTrade=null; // {dir, entry, sl, tp, startTime}
let stats={total:0,wins:0};
function loadTV(){document.getElementById('tv_chart').innerHTML=''; new TradingView.widget({"autosize":true,"symbol":"OANDA:XAUUSD","interval":'5',"timezone":"Africa/Johannesburg","theme":"dark","style":"1","container_id":"tv_chart"});} loadTV();

setInterval(()=>{
  lastPrice+=(Math.random()-0.49)*0.75;
  ticks.push(lastPrice); if(ticks.length>250) ticks.shift();
  document.getElementById('livePrice').innerText=lastPrice.toFixed(2);
  if(activeTrade){ checkTP_SL(); } else if(ticks.length>=8){ analyzeNew(); }
},550);

function ema(a,p){let k=2/(p+1), e=a[0]; for(let i=1;i<a.length;i++) e=a[i]*k+e*(1-k); return e;}
function rsi(a,per=14){if(a.length<per+1) return 50; let g=0,l=0; for(let i=a.length-per;i<a.length;i++){let d=a[i]-a[i-1]; if(d>=0) g+=d; else l-=d;} return 100-(100/(1+g/(l||0.001)));}

function analyzeNew(){
  let e10=ema(ticks.slice(-10),10), e20=ema(ticks.slice(-20),20);
  let r=rsi(ticks,14), r7=rsi(ticks.slice(-12),7);
  let last=ticks[ticks.length-1];
  let low=Math.min(...ticks.slice(-15)), high=Math.max(...ticks.slice(-15));

  if(e10>=e20-0.6 && e10<=e20+0.8 && r>=36 && r<=58 && r7>43 && (last-low)<3.0){
    openTrade("BUY",last,last-3.5,last+14.0);
  }else if(e10>=e20-0.8 && e10<=e20+0.6 && r>=42 && r<=65 && r7<57 && (high-last)<3.0){
    openTrade("SELL",last,last+3.5,last-14.0);
  }else{
    document.getElementById('signalText').innerText="WAIT";
    document.getElementById('reason').innerText="Scanning early dip... RSI "+r.toFixed(0)+" EMA "+e10.toFixed(1)+" vs "+e20.toFixed(1);
    document.getElementById('signalCard').className="wait bg-slate-900 rounded-[28px] p-5 mt-3 text-center";
  }
}

function openTrade(dir,entry,sl,tp){
  activeTrade={dir,entry,sl,tp,start:Date.now()};
  stats.total++;
  document.getElementById('signalText').innerText=dir;
  document.getElementById('signalCard').className=(dir==="BUY"?"buy":"sell")+" bg-slate-900 rounded-[28px] p-5 mt-3 text-center";
  document.getElementById('tradeStatus').innerText="🔒 ACTIVE "+dir+" - Holding until TP/SL hit";
  document.getElementById('tradeStatus').className="mt-2 text-[11px] bg-yellow-400 text-black rounded-full py-1 px-3 inline-block font-bold";
  document.getElementById('reason').innerText=dir+" ACTIVE at "+entry.toFixed(2)+" → TP "+tp.toFixed(2)+" will NOT change signal until TP/SL hit";
  document.getElementById('tradeBox').classList.remove('hidden');
  document.getElementById('pnlBox').classList.remove('hidden');
  document.getElementById('entryP').innerText=entry.toFixed(2);
  document.getElementById('slP').innerText=sl.toFixed(2);
  document.getElementById('tpP').innerText=tp.toFixed(2);
  document.getElementById('activeInfo').innerText="🔒 "+dir+" ACTIVE";
  document.getElementById('tradeCount').innerText="Trades: "+stats.total+" | Wins: "+stats.wins;
  document.getElementById('buySound').play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate([400,100,400]);
}

function checkTP_SL(){
  if(!activeTrade) return;
  let pnl=0, dist=0, hit=false, win=false;
  if(activeTrade.dir==="BUY"){
    pnl=lastPrice-activeTrade.entry;
    dist=activeTrade.tp-lastPrice;
    if(lastPrice>=activeTrade.tp){hit=true; win=true;}
    if(lastPrice<=activeTrade.sl){hit=true; win=false;}
  }else{
    pnl=activeTrade.entry-lastPrice;
    dist=lastPrice-activeTrade.tp;
    if(lastPrice<=activeTrade.tp){hit=true; win=true;}
    if(lastPrice>=activeTrade.sl){hit=true; win=false;}
  }

  let progress=((pnl+3.5)/17.5)*100; progress=Math.max(0,Math.min(100,progress));
  document.getElementById('livePnl').innerText=(pnl>=0?"+":"")+pnl.toFixed(2)+"$";
  document.getElementById('livePnl').className=pnl>=0?"font-mono font-bold text-green-400":"font-mono font-bold text-red-400";
  document.getElementById('progressBar').style.width=progress+"%";
  document.getElementById('progressBar').className=pnl>=0?"h-2 rounded-full bg-green-500":"h-2 rounded-full bg-red-500";
  document.getElementById('distance').innerText="To TP: $"+dist.toFixed(2)+" | PnL: $"+pnl.toFixed(2)+" | Holding... Will NOT change until hit";
  document.getElementById('entryStatus').innerText=pnl>=0?"🟢 +$"+pnl.toFixed(2):"🔴 $"+pnl.toFixed(2);

  if(hit){
    if(win){
      stats.wins++;
      document.getElementById('signalCard').className="tp-hit bg-slate-900 rounded-[28px] p-5 mt-3 text-center";
      document.getElementById('signalText').innerText="TP HIT!";
      document.getElementById('tradeStatus').innerText="✅ TP HIT +$14 - Searching next trade...";
      document.getElementById('tradeStatus').className="mt-2 text-[11px] bg-green-400 text-black rounded-full py-1 px-3 inline-block font-bold";
      document.getElementById('reason').innerText="✅ TP HIT! +$14 WIN. Locked trade closed. Scanning for next early entry...";
      document.getElementById('tpSound').play().catch(()=>{});
    }else{
      document.getElementById('signalText').innerText="SL HIT";
      document.getElementById('tradeStatus').innerText="❌ SL HIT -$3.5 - Searching next...";
      document.getElementById('tradeStatus').className="mt-2 text-[11px] bg-red-400 text-black rounded-full py-1 px-3 inline-block font-bold";
      document.getElementById('reason').innerText="❌ SL HIT -$3.5. Small loss, RR 1:4 covers it. Scanning next...";
    }
    activeTrade=null;
    setTimeout(()=>{document.getElementById('tradeBox').classList.add('hidden'); document.getElementById('pnlBox').classList.add('hidden'); document.getElementById('activeInfo').innerText="No active trade - Scanning next..."; document.getElementById('tradeCount').innerText="Trades: "+stats.total+" | Wins: "+stats.wins+" | WR: "+(stats.total?((stats.wins/stats.total)*100).toFixed(0):0)+"%";},3500);
  }
}
</script>
</body>
</html>
