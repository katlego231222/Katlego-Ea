<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Katlego V5.8 Clean</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
body{background:#050714;color:white}
.buy{border:3px solid #22c55e;box-shadow:0 0 50px #22c55e88}
.sell{border:3px solid #ef4444;box-shadow:0 0 50px #ef444488}
.wait{border:2px solid #334155}
</style>
</head>
<body class="p-2">
<div class="max-w-lg mx-auto">
<h1 class="text-center font-black text-sm">KATLEGO <span class="text-emerald-400">V5.8</span> <span class="text-[8px] bg-white text-black px-2 py-1 rounded-full">CLEAN</span></h1>

<div id="signalCard" class="wait bg-slate-900 rounded-[28px] p-5 mt-3 text-center">
<div id="signalText" class="text-7xl font-black tracking-tighter">WAIT</div>
<div id="reason" class="text-[12px] mt-2 text-slate-300">Scanning early dip for entry...</div>

<div id="tradeBox" class="grid grid-cols-3 gap-3 mt-5 hidden">
<div class="bg-black rounded-2xl p-4 border border-slate-700">
<div class="text-[9px] text-slate-400 tracking-widest">ENTRY</div>
<div id="entryP" class="font-mono font-black text-xl mt-1">--</div>
<div class="text-[8px] text-emerald-400 mt-1 font-bold">EARLY</div>
</div>
<div class="bg-black rounded-2xl p-4 border border-red-900">
<div class="text-[9px] text-red-300 tracking-widest">SHORT SL</div>
<div id="slP" class="font-mono font-black text-xl mt-1 text-red-400">--</div>
<div id="slD" class="text-[8px] bg-red-900 text-white px-2 py-1 rounded-full mt-1 inline-block">-$3.5</div>
</div>
<div class="bg-black rounded-2xl p-4 border border-green-900">
<div class="text-[9px] text-green-300 tracking-widest">LONG TP</div>
<div id="tpP" class="font-mono font-black text-xl mt-1 text-green-400">--</div>
<div id="tpD" class="text-[8px] bg-green-900 text-white px-2 py-1 rounded-full mt-1 inline-block">+$14 1:4</div>
</div>
</div>
</div>

<div class="bg-slate-900 rounded-2xl p-3 mt-3 border border-slate-800 flex justify-between items-center">
<div>
<div class="text-[9px] text-slate-400">GOLD LIVE</div>
<div id="livePrice" class="text-2xl font-mono font-black">417
